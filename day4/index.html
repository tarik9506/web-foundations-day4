<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter & Dark Mode</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="header">
            <h1>Live Note & Counter</h1>
            <button id="theme-toggle" type="button">Dark mode</button>
        </header>

        <div class="editor-section">
            <label for="note-text">Your Note</label>
            <textarea id="note-text" placeholder="Start typing your note here... (max 200 characters)"></textarea>
            
            <div class="counter-display">
                <p id="char-count">0 / 200 characters</p>
                <p id="word-count">0 words</p>
            </div>

            <div class="actions">
                <button id="clear-btn" type="button">Clear</button>
            </div>
        </div>
    </main>
</body>
</html>
